<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkBy - Booking Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#131b2e",
                        "on-tertiary-fixed": "#3f0300",
                        "primary-container": "#21a385",
                        "background": "#0b1326",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#7c2d20",
                        "on-primary-fixed": "#002018",
                        "surface": "#0b1326",
                        "on-primary": "#00382c",
                        "on-surface-variant": "#bccac3",
                        "surface-container-high": "#222a3d",
                        "secondary-fixed-dim": "#c0c1ff",
                        "warning-amber": "#F59E0B",
                        "on-background": "#dae2fd",
                        "on-secondary-container": "#b0b2ff",
                        "surface-container-lowest": "#060e20",
                        "error-container": "#93000a",
                        "on-secondary": "#1000a9",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed": "#07006c",
                        "surface-bright": "#31394d",
                        "tertiary-fixed-dim": "#ffb4a6",
                        "inverse-on-surface": "#283044",
                        "inverse-primary": "#006b56",
                        "on-surface": "#dae2fd",
                        "on-tertiary": "#5e170c",
                        "signature-gradient": "linear-gradient(90deg, #A855F7 0%, #EC4899 33%, #F97316 66%, #EAB308 100%)",
                        "outline": "#86948e",
                        "secondary": "#c0c1ff",
                        "surface-container": "#171f33",
                        "surface-dim": "#0b1326",
                        "tertiary-fixed": "#ffdad4",
                        "surface-variant": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#3131c0",
                        "outline-variant": "#3d4945",
                        "map-void": "#020617",
                        "on-primary-fixed-variant": "#005140",
                        "surface-tint": "#66daba",
                        "primary-fixed-dim": "#66daba",
                        "tertiary": "#ffb4a6",
                        "primary-fixed": "#84f7d5",
                        "on-primary-container": "#003025",
                        "surface-container-highest": "#2d3449",
                        "glass-border": "rgba(255, 255, 255, 0.12)",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-container": "#541006",
                        "secondary-fixed": "#e1e0ff",
                        "on-error": "#690005",
                        "tertiary-container": "#d97462",
                        "primary": "#66daba"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "44px",
                        "unit": "8px",
                        "gutter": "16px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Space Grotesk"],
                        "body-sm": ["Inter"],
                        "data-sm": ["JetBrains Mono"],
                        "headline-lg": ["Space Grotesk"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "data-lg": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "data-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],

                        "data-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-shadow {
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
        }
        .ticket-divider {
            background-image: radial-gradient(circle, rgba(15, 23, 42, 0.7) 4px, transparent 5px);
            background-size: 16px 16px;
            background-position: center;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col antialiased relative">
<!-- TopNavBar -->
<!-- Suppressed for transactional/confirmation screen per Semantic Shell Mandate -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-margin relative z-10 w-full max-w-4xl mx-auto my-12">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Success Animation / Header -->
<div class="mb-8 flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full bg-primary-container/20 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(33,163,133,0.3)] border border-primary/30">
<span class="material-symbols-outlined text-primary text-5xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Booking Confirmed</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your spot is secured and ready.</p>
</div>
<!-- Digital Ticket Card -->
<div class="glass-card glow-shadow rounded-xl w-full flex flex-col relative overflow-hidden mb-8">
<!-- Ticket Top -->
<div class="p-6 flex flex-col">
<div class="flex justify-between items-start mb-6">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase tracking-wider">Spot Reference</p>
<p class="font-data-lg text-data-lg text-primary font-bold">#PKB-8924</p>
</div>
<div class="bg-surface-container-high rounded-lg p-2 border border-glass-border">
<span class="material-symbols-outlined text-on-surface-variant text-xl">qr_code_2</span>
</div>
</div>
<div class="space-y-4">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Location</p>
<p class="font-body-md text-body-md font-semibold text-on-surface">1450 Tech Hub Avenue</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Level B2, Spot 44</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Arrival</p>
<p class="font-body-md text-body-md font-semibold text-on-surface">Today, 09:00 AM</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Departure</p>
<p class="font-body-md text-body-md font-semibold text-on-surface">Today, 06:00 PM</p>
</div>
</div>
</div>
</div>
<!-- Perforated Divider -->
<div class="h-4 w-full relative flex items-center">
<div class="absolute left-[-10px] w-5 h-5 rounded-full bg-background border-r border-glass-border"></div>
<div class="w-full h-[2px] border-t-2 border-dashed border-glass-border mx-4"></div>
<div class="absolute right-[-10px] w-5 h-5 rounded-full bg-background border-l border-glass-border"></div>
</div>
<!-- Ticket Bottom / Actions -->
<div class="p-6 bg-surface-container-low/50">
<div class="flex justify-between items-center mb-6">
<span class="font-body-sm text-body-sm text-on-surface-variant">Total Paid</span>
<span class="font-data-lg text-data-lg text-on-surface font-bold">$24.00</span>
</div>
<div class="flex flex-col gap-3">
<button class="w-full bg-[#0F9B7E] text-white hover:bg-primary-container transition-colors duration-200 rounded-lg py-3 px-4 font-body-md text-body-md font-semibold flex items-center justify-center gap-2">
<span class="material-symbols-outlined">account_balance_wallet</span>
                            Add to Wallet
                        </button>
<div class="flex gap-3">
<button class="flex-1 bg-surface-container-high hover:bg-surface-bright transition-colors duration-200 text-on-surface border border-glass-border rounded-lg py-3 px-4 font-body-sm text-body-sm font-medium flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">directions</span>
                                Directions
                            </button>
<button class="flex-1 bg-surface-container-high hover:bg-surface-bright transition-colors duration-200 text-on-surface border border-glass-border rounded-lg py-3 px-4 font-body-sm text-body-sm font-medium flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">receipt_long</span>
                                My Bookings
                            </button>
</div>
</div>
</div>
</div>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">Return to Map</a>
</div>
</main>
<!-- Footer -->
<!-- Suppressed for transactional/confirmation screen per Semantic Shell Mandate -->
</body></html>
